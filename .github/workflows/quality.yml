name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP and frontend quality
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:VGVzdEtleUZvckNpcGxpbmVPbmx5MDEyMzQ1Njc4OTA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      GEMINI_API_KEY: ''
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ''
      QDRANT_COLLECTION: prime_google_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run JavaScript tests
        run: node --test tests/JavaScript/*.test.js

      - name: Verify changed PHP formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              echo "Unsupported event for changed-file Pint: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" == "$head_sha" ]]; then
            echo "Invalid base/head commit identities for changed-file Pint." >&2
            exit 1
          fi

          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"

          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$head_sha" -- '*.php' > "$changed_files"

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < "$changed_files"

          if ((${#files[@]} == 0)); then
            echo "No changed PHP files; Pint check passed."
            exit 0
          fi

          vendor/bin/pint --test "${files[@]}"

      - name: Build frontend
        run: npm run build
